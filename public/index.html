<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOZAI - Multilingual Misinformation Detector</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --sidebar-color: rgba(18, 22, 30, 0.95);
            --surface-color: rgba(22, 27, 34, 0.85);
            --border-color: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.18);
            --primary-gradient: linear-gradient(135deg, #00f2fe 0%, #4facfe 50%, #6f42c1 100%);
            --user-bubble: linear-gradient(135deg, #2563eb, #7c3aed);
            --bot-bubble: rgba(30, 36, 46, 0.95);
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(79, 172, 254, 0.1), transparent 35%),
                radial-gradient(circle at 90% 80%, rgba(124, 58, 237, 0.12), transparent 40%);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .app-container {
            width: 100%;
            max-width: 1180px;
            height: 92vh;
            display: flex;
            background: var(--surface-color);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: var(--sidebar-color);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px 16px;
            gap: 16px;
            flex-shrink: 0;
        }

        .new-chat-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font-size: 13.5px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .new-chat-btn:hover {
            background: rgba(255, 255, 255, 0.09);
            border-color: var(--border-hover);
        }

        .history-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-secondary);
            font-weight: 600;
            padding-left: 6px;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 4px;
        }

        .history-item {
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            background: transparent;
            border: 1px solid transparent;
            transition: all 0.15s ease;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .history-item:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--border-color);
        }

        .history-title {
            font-size: 13px;
            color: #e6edf3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
        }

        .history-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 10.5px;
            color: var(--text-secondary);
        }

        .history-badge {
            padding: 1px 6px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 9.5px;
        }

        .history-empty {
            font-size: 12px;
            color: var(--text-secondary);
            text-align: center;
            margin-top: 30px;
            line-height: 1.5;
            padding: 0 10px;
        }

        .clear-history-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 9px 12px;
            border-radius: 10px;
            border: 1px solid rgba(248, 81, 73, 0.2);
            background: rgba(248, 81, 73, 0.06);
            color: #ff7b72;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: auto;
        }

        .clear-history-btn:hover {
            background: rgba(248, 81, 73, 0.15);
            border-color: rgba(248, 81, 73, 0.4);
        }

        /* Main View */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            padding: 18px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .header-left {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .chat-title {
            font-size: 22px;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .chat-subtitle {
            font-size: 12.5px;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .status-badge {
            font-size: 12px;
            color: #3fb950;
            background: rgba(63, 185, 80, 0.15);
            padding: 4px 10px;
            border-radius: 12px;
            border: 1px solid rgba(63, 185, 80, 0.3);
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: #3fb950;
            border-radius: 50%;
        }

        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 82%;
            padding: 14px 18px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.5;
            word-wrap: break-word;
            animation: popIn 0.2s ease-out;
        }

        @keyframes popIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user {
            align-self: flex-end;
            background: var(--user-bubble);
            color: #ffffff;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .bot {
            align-self: flex-start;
            background: var(--bot-bubble);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 4px;
            width: 100%;
        }

        .bot.error {
            border-color: rgba(248, 81, 73, 0.4);
            background: rgba(248, 81, 73, 0.1);
            color: #ff7b72;
            width: auto;
        }

        #input-container {
            padding: 16px 20px;
            background: rgba(13, 17, 23, 0.6);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            align-items: center;
        }

        input {
            flex: 1;
            padding: 12px 18px;
            border-radius: 25px;
            border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, background-color 0.2s;
        }

        input:focus {
            border-color: #4facfe;
            background: rgba(255, 255, 255, 0.08);
        }

        input::placeholder {
            color: var(--text-secondary);
        }

        button.send-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            background: var(--primary-gradient);
            color: white;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        button.send-btn:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }

        button.send-btn:active {
            transform: translateY(0);
        }

        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <button class="new-chat-btn" onclick="startNewChat()">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                New Analysis
            </button>

            <span class="history-label">Recent Verifications</span>
            <div id="history-list" class="history-list"></div>

            <button class="clear-history-btn" onclick="clearAllHistory()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                </svg>
                Clear History
            </button>
        </aside>

        <!-- Main Chat -->
        <main class="chat-main">
            <header class="chat-header">
                <div class="header-left">
                    <span class="chat-title">MOZAI</span>
                    <span class="chat-subtitle">AI-powered multilingual misinformation detector & fact-checker.</span>
                </div>
                <span class="status-badge"><span class="status-dot"></span> Analyzer Active</span>
            </header>

            <div id="chat-box"></div>

            <div id="input-container">
                <input 
                    type="text" 
                    id="prompt" 
                    placeholder="Paste news or claim that you want to analyse" 
                    onkeypress="if(event.key === 'Enter') sendMessage()"
                >
                <button class="send-btn" onclick="sendMessage()">Verify</button>
            </div>
        </main>
    </div>

    <script>
        let chatHistory = JSON.parse(localStorage.getItem('mozai_history') || '[]');

        function renderHistory() {
            const list = document.getElementById('history-list');
            if (chatHistory.length === 0) {
                list.innerHTML = `<div class="history-empty">No previous verifications yet. Checked messages will appear here.</div>`;
                return;
            }

            list.innerHTML = chatHistory.map((item, index) => {
                const isSafe = item.result.risk_level === 'SAFE';
                const color = isSafe ? '#3fb950' : '#f85149';
                const bg = isSafe ? 'rgba(63, 185, 80, 0.15)' : 'rgba(248, 81, 73, 0.15)';
                return `
                    <div class="history-item" onclick="loadHistoryItem(${index})">
                        <div class="history-title">${item.prompt}</div>
                        <div class="history-meta">
                            <span>${item.time}</span>
                            <span class="history-badge" style="color: ${color}; background: ${bg};">${item.result.risk_level}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function startNewChat() {
            document.getElementById('chat-box').innerHTML = '';
            document.getElementById('prompt').value = '';
            document.getElementById('prompt').focus();
        }

        function clearAllHistory() {
            if (chatHistory.length === 0) return;
            if (confirm("Are you sure you want to clear all analysis history?")) {
                chatHistory = [];
                localStorage.removeItem('mozai_history');
                renderHistory();
                startNewChat();
            }
        }

        function loadHistoryItem(index) {
            const item = chatHistory[index];
            if (!item) return;

            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML = '';
            appendUserMessage(item.prompt);
            renderBotResult(item.result);
        }

        function appendUserMessage(text) {
            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML += `<div class="message user">${text}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function renderBotResult(data) {
            const chatBox = document.getElementById('chat-box');
            const isSafe = data.risk_level === 'SAFE';
            const riskBadgeColor = isSafe ? '#3fb950' : '#f85149';
            const riskBadgeBg = isSafe ? 'rgba(63, 185, 80, 0.15)' : 'rgba(248, 81, 73, 0.15)';
            const confidencePercent = Math.round(data.confidence_score * 100);

            const htmlContent = `
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px;">
                    <span style="font-size: 13px; color: var(--text-secondary);">
                        <b style="color: #fff;">Language:</b> ${data.detected_language} ${data.is_code_mixed ? '(Code-mixed)' : ''}
                    </span>
                    <span style="font-size: 11px; font-weight: bold; padding: 3px 8px; border-radius: 10px; background: ${riskBadgeBg}; color: ${riskBadgeColor}; border: 1px solid ${riskBadgeColor}40;">
                        ${data.risk_level} (${confidencePercent}%)
                    </span>
                </div>
                <div style="margin-bottom: 10px; font-size: 14px; line-height: 1.5; color: #f0f6fc;">
                    ${data.reasoning}
                </div>
                ${data.counter_reply ? `
                    <div style="background: rgba(63, 185, 80, 0.1); border-left: 3px solid #3fb950; padding: 10px; border-radius: 6px; margin-top: 10px;">
                        <div style="font-size: 11px; color: #3fb950; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;">
                            WhatsApp Counter Reply (${data.counter_reply.script}):
                        </div>
                        <div style="font-size: 13px; font-style: italic; margin-top: 4px; color: #e6edf3;">
                            "${data.counter_reply.text}"
                        </div>
                    </div>
                ` : ''}
            `;

            chatBox.innerHTML += `<div class="message bot">${htmlContent}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('prompt');
            const chatBox = document.getElementById('chat-box');
            const prompt = input.value.trim();
            
            if (!prompt) return;

            appendUserMessage(prompt);
            input.value = '';

            const tempId = 'temp-' + Date.now();
            chatBox.innerHTML += `<div class="message bot" id="${tempId}" style="color: var(--text-secondary);">Analyzing claims & language...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: prompt })
                });
                
                const data = await response.json();
                const tempElement = document.getElementById(tempId);
                if (tempElement) tempElement.remove();
                
                if (!response.ok || data.error) {
                    chatBox.innerHTML += `<div class="message bot error">Error: ${data.error || 'Failed to analyze'}</div>`;
                } else {
                    renderBotResult(data);

                    const now = new Date();
                    const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    chatHistory.unshift({ prompt, result: data, time: timeString });
                    if (chatHistory.length > 15) chatHistory.pop();
                    localStorage.setItem('mozai_history', JSON.stringify(chatHistory));
                    renderHistory();
                }
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (error) {
                const tempElement = document.getElementById(tempId);
                if (tempElement) tempElement.remove();
                chatBox.innerHTML += `<div class="message bot error">Error: Could not connect to backend server.</div>`;
            }
        }

        renderHistory();
    </script>
</body>
</html>
