<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mozai — Multilingual Misinformation Detector</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@500;600&family=Noto+Sans+Tamil:wght@500;600&family=Noto+Sans+Gujarati:wght@500;600&family=Noto+Sans+Malayalam:wght@500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Deep teal (cover-slide) + cream (content-slide) + terracotta/tan, lifted from the Mozai deck */
            --teal-900: #0c2f2b;
            --teal-800: #123f3a;
            --teal-700: #1c5850;
            --teal-500: #2f8f83;
            --sage-100: #dcece2;
            --sage-700: #2c6b4d;
            --tan-100: #f4e8ca;
            --tan-500: #c9a468;
            --tan-700: #8a6a2b;
            --rose-100: #f3ddd5;
            --rose-700: #a04730;
            --cream-50: #faf6ec;
            --cream-100: #f1e9d7;
            --ink: #17332e;
            --ink-soft: #52685f;
            --ink-faint: #7c8d84;
            --line: rgba(23, 51, 46, 0.1);
            --line-dark: rgba(247, 242, 230, 0.14);
            --font-display: 'Baloo 2', 'Noto Sans', sans-serif;
            --font-body: 'Noto Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        *:focus-visible {
            outline: 2px solid var(--teal-500);
            outline-offset: 2px;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--teal-900);
            background-image:
                radial-gradient(circle at 8% 15%, rgba(47, 143, 131, 0.22), transparent 38%),
                radial-gradient(circle at 92% 85%, rgba(201, 164, 104, 0.16), transparent 42%);
            color: var(--ink);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .app-container {
            width: 100%;
            max-width: 1180px;
            height: 92vh;
            display: flex;
            background: var(--cream-50);
            border: 1px solid rgba(0, 0, 0, 0.06);
            border-radius: 20px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
            overflow: hidden;
        }

        /* Sidebar — the "cover" panel */
        .sidebar {
            width: 280px;
            background: linear-gradient(175deg, var(--teal-900), var(--teal-800));
            border-right: 1px solid var(--line-dark);
            display: flex;
            flex-direction: column;
            padding: 22px 16px;
            gap: 16px;
            flex-shrink: 0;
            color: var(--cream-50);
        }

        .brand-mark {
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 21px;
            letter-spacing: 0.2px;
            color: var(--cream-50);
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .brand-mark .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--tan-500);
            display: inline-block;
            margin-left: 2px;
        }

        .brand-sub {
            font-size: 11.5px;
            color: rgba(247, 242, 230, 0.55);
            line-height: 1.4;
        }

        .new-chat-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid var(--line-dark);
            background: rgba(247, 242, 230, 0.07);
            color: var(--cream-50);
            font-family: var(--font-body);
            font-size: 13.5px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .new-chat-btn:hover {
            background: rgba(247, 242, 230, 0.13);
            border-color: rgba(201, 164, 104, 0.5);
        }

        .history-label {
            font-size: 12px;
            font-weight: 600;
            color: rgba(247, 242, 230, 0.58);
            padding-left: 6px;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 4px;
        }

        .history-item {
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            background: transparent;
            border: 1px solid transparent;
            transition: background 0.15s ease, border-color 0.15s ease;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .history-item:hover {
            background: rgba(247, 242, 230, 0.06);
            border-color: var(--line-dark);
        }

        .history-title {
            font-size: 13px;
            color: var(--cream-50);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
        }

        .history-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 10.5px;
            color: rgba(247, 242, 230, 0.5);
        }

        .history-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-weight: 600;
            font-size: 10px;
        }

        .history-badge .tier-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        .history-empty {
            font-size: 12px;
            color: rgba(247, 242, 230, 0.5);
            text-align: center;
            margin-top: 30px;
            line-height: 1.55;
            padding: 0 10px;
        }

        .clear-history-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 9px 12px;
            border-radius: 10px;
            border: 1px solid rgba(224, 138, 110, 0.3);
            background: rgba(224, 138, 110, 0.1);
            color: #e3a98d;
            font-family: var(--font-body);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: auto;
        }

        .clear-history-btn:hover {
            background: rgba(224, 138, 110, 0.18);
            border-color: rgba(224, 138, 110, 0.5);
        }

        /* Main view — the "content page" panel */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--cream-50);
        }

        .chat-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .header-left {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .chat-title-row {
            display: flex;
            align-items: baseline;
            gap: 10px;
        }

        .chat-title {
            font-family: var(--font-display);
            font-size: 23px;
            font-weight: 800;
            background: linear-gradient(120deg, var(--teal-800), var(--sage-700));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .chat-tagline {
            font-size: 12px;
            font-style: italic;
            color: var(--tan-700);
        }

        .chat-subtitle {
            font-size: 12.5px;
            color: var(--ink-soft);
        }

        .status-badge {
            font-size: 12px;
            color: var(--sage-700);
            background: var(--sage-100);
            padding: 4px 10px;
            border-radius: 12px;
            border: 1px solid rgba(44, 107, 77, 0.3);
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            font-weight: 500;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: var(--sage-700);
            border-radius: 50%;
        }

        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Empty state */
        .empty-state {
            margin: auto;
            max-width: 420px;
            text-align: center;
            color: var(--ink-soft);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .empty-state svg {
            color: var(--teal-500);
            opacity: 0.85;
        }

        .empty-state p {
            font-size: 13.5px;
            line-height: 1.55;
        }

        .lang-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
        }

        .lang-chip {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 20px;
            background: var(--cream-100);
            border: 1px solid var(--line);
            color: var(--ink);
        }

        .lang-chip .native {
            font-weight: 600;
            color: var(--teal-700);
        }

        .message {
            max-width: 82%;
            padding: 14px 18px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.55;
            word-wrap: break-word;
            animation: popIn 0.2s ease-out;
        }

        @media (prefers-reduced-motion: reduce) {
            .message { animation: none; }
        }

        @keyframes popIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--teal-700), var(--teal-500));
            color: #ffffff;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 14px rgba(28, 88, 80, 0.28);
        }

        .bot {
            align-self: flex-start;
            background: var(--cream-100);
            color: var(--ink);
            border: 1px solid var(--line);
            border-bottom-left-radius: 4px;
            width: 100%;
        }

        .bot.pending {
            color: var(--ink-soft);
            font-style: italic;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pulse-dots span {
            display: inline-block;
            width: 5px;
            height: 5px;
            margin-right: 2px;
            border-radius: 50%;
            background: var(--teal-500);
            animation: pulse 1.1s infinite ease-in-out;
        }
        .pulse-dots span:nth-child(2) { animation-delay: 0.15s; }
        .pulse-dots span:nth-child(3) { animation-delay: 0.3s; }

        @keyframes pulse {
            0%, 80%, 100% { opacity: 0.25; }
            40% { opacity: 1; }
        }

        @media (prefers-reduced-motion: reduce) {
            .pulse-dots span { animation: none; opacity: 0.7; }
        }

        .bot.error {
            border-color: rgba(160, 71, 48, 0.35);
            background: var(--rose-100);
            color: var(--rose-700);
            width: auto;
        }

        .result-badge {
            display: inline-flex;
            align-items: center;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 10px;
        }

        .confidence-track {
            width: 100%;
            height: 4px;
            border-radius: 4px;
            margin-top: 8px;
            overflow: hidden;
        }

        .confidence-fill {
            height: 100%;
            border-radius: 4px;
        }

        .reply-box {
            border-radius: 10px;
            padding: 10px 12px;
            margin-top: 10px;
            background: var(--sage-100);
            border: 1px solid rgba(44, 107, 77, 0.25);
        }

        .reply-copy-btn {
            border: none;
            background: none;
            color: var(--sage-700);
            font-size: 10.5px;
            font-weight: 600;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 6px;
        }

        .reply-copy-btn:hover {
            background: rgba(44, 107, 77, 0.12);
        }

        #input-container {
            padding: 16px 20px;
            background: var(--cream-50);
            border-top: 1px solid var(--line);
            display: flex;
            gap: 12px;
            align-items: center;
        }

        input {
            flex: 1;
            padding: 12px 18px;
            border-radius: 25px;
            border: 1px solid var(--line);
            background: var(--cream-100);
            color: var(--ink);
            font-family: var(--font-body);
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, background-color 0.2s;
        }

        input:focus {
            border-color: var(--teal-500);
            background: #ffffff;
        }

        input::placeholder {
            color: var(--ink-faint);
        }

        button.send-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(135deg, var(--teal-700), var(--teal-500));
            color: white;
            font-family: var(--font-body);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        button.send-btn:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }

        button.send-btn:active {
            transform: translateY(0);
        }

        button.send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(23, 51, 46, 0.18);
            border-radius: 3px;
        }
        .sidebar ::-webkit-scrollbar-thumb {
            background: rgba(247, 242, 230, 0.18);
        }

        @media (max-width: 760px) {
            .sidebar { display: none; }
            .app-container { max-width: 100%; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div>
                <div class="brand-mark">Mozai<span class="dot"></span></div>
                <div class="brand-sub">Catching conversation in every language</div>
            </div>

            <button class="new-chat-btn" onclick="startNewChat()">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                New Analysis
            </button>

            <span class="history-label">Recent verifications</span>
            <div id="history-list" class="history-list"></div>

            <button class="clear-history-btn" onclick="clearAllHistory()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                </svg>
                Clear history
            </button>
        </aside>

        <!-- Main Chat -->
        <main class="chat-main">
            <header class="chat-header">
                <div class="header-left">
                    <div class="chat-title-row">
                        <span class="chat-title">Mozai</span>
                        <span class="chat-tagline">Catching Conversation in Every Pace</span>
                    </div>
                    <span class="chat-subtitle">Multilingual misinformation detector — Hindi, Tamil, Gujarati, Malayalam &amp; more</span>
                </div>
                <span class="status-badge"><span class="status-dot"></span> Analyzer Active</span>
            </header>

            <div id="chat-box"></div>

            <div id="input-container">
                <input
                    type="text"
                    id="prompt"
                    placeholder="Paste news or claim that you want to analyse"
                    onkeypress="if(event.key === 'Enter') sendMessage()"
                    maxlength="4000"
                >
                <button class="send-btn" id="send-btn" onclick="sendMessage()">Verify</button>
            </div>
        </main>
    </div>

    <script>
        // In-memory session history. (localStorage doesn't persist inside this preview,
        // so history resets on reload here — swap back to localStorage.getItem/setItem
        // if you're running this on your own server and want it to persist.)
        let chatHistory = [];

        const PIPELINE_LANGUAGES = [
            { native: 'हिन्दी', label: 'Hindi' },
            { native: 'தமிழ்', label: 'Tamil' },
            { native: 'ગુજરાતી', label: 'Gujarati' },
            { native: 'മലയാളം', label: 'Malayalam' },
            { native: 'English', label: 'English' }
        ];

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str == null ? '' : String(str);
            return div.innerHTML;
        }

        // Normalizes whatever risk label the API returns to one of the three
        // tiers from the pipeline (verified / misleading / false), so the UI
        // still renders sensibly even if the backend sends SAFE/UNSAFE instead.
        function riskTier(rawLabel) {
            const label = (rawLabel || '').toString().trim().toUpperCase();
            const FALSE_SET = ['FALSE', 'UNSAFE', 'HOAX', 'FAKE'];
            const VERIFIED_SET = ['VERIFIED', 'SAFE', 'TRUE', 'ACCURATE'];

            let tier = 'misleading';
            if (VERIFIED_SET.includes(label)) tier = 'verified';
            else if (FALSE_SET.includes(label)) tier = 'false';

            const styles = {
                verified: { bg: 'var(--sage-100)', border: 'rgba(44,107,77,0.3)', text: 'var(--sage-700)', dot: 'var(--sage-700)' },
                misleading: { bg: 'var(--tan-100)', border: 'rgba(138,106,43,0.3)', text: 'var(--tan-700)', dot: 'var(--tan-700)' },
                false: { bg: 'var(--rose-100)', border: 'rgba(160,71,48,0.3)', text: 'var(--rose-700)', dot: 'var(--rose-700)' }
            };
            return Object.assign({ tier, rawLabel: rawLabel || 'UNKNOWN' }, styles[tier]);
        }

        function renderEmptyState() {
            const chips = PIPELINE_LANGUAGES.map(l =>
                `<span class="lang-chip"><span class="native">${l.native}</span> · ${l.label}</span>`
            ).join('');
            return `
                <div class="empty-state">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                    <p>Paste a forwarded WhatsApp message, news snippet, or claim below. Mozai checks it against verified sources and drafts an in-language reply you can send straight back.</p>
                    <div class="lang-chips">${chips}</div>
                </div>
            `;
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            if (chatHistory.length === 0) {
                list.innerHTML = `<div class="history-empty">No previous verifications yet. Checked messages will appear here.</div>`;
                return;
            }

            list.innerHTML = chatHistory.map((item, index) => {
                const t = riskTier(item.result.risk_level);
                return `
                    <div class="history-item" onclick="loadHistoryItem(${index})">
                        <div class="history-title">${escapeHtml(item.prompt)}</div>
                        <div class="history-meta">
                            <span>${item.time}</span>
                            <span class="history-badge" style="color: ${t.text};">
                                <span class="tier-dot" style="background: ${t.dot};"></span>${escapeHtml(t.rawLabel)}
                            </span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function startNewChat() {
            document.getElementById('chat-box').innerHTML = renderEmptyState();
            document.getElementById('prompt').value = '';
            document.getElementById('prompt').focus();
        }

        function clearAllHistory() {
            if (chatHistory.length === 0) return;
            if (confirm('Are you sure you want to clear all analysis history?')) {
                chatHistory = [];
                renderHistory();
                startNewChat();
            }
        }

        function loadHistoryItem(index) {
            const item = chatHistory[index];
            if (!item) return;

            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML = '';
            appendUserMessage(item.prompt);
            renderBotResult(item.result);
        }

        function appendUserMessage(text) {
            const chatBox = document.getElementById('chat-box');
            if (chatBox.querySelector('.empty-state')) chatBox.innerHTML = '';
            chatBox.innerHTML += `<div class="message user">${escapeHtml(text)}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function copyReply(btn, text) {
            navigator.clipboard.writeText(text).then(() => {
                const original = btn.textContent;
                btn.textContent = 'Copied';
                setTimeout(() => { btn.textContent = original; }, 1500);
            }).catch(() => {});
        }

        function renderBotResult(data) {
            const chatBox = document.getElementById('chat-box');
            const t = riskTier(data.risk_level);
            const confidencePercent = Math.round((data.confidence_score || 0) * 100);
            const language = escapeHtml(data.detected_language || 'Unknown');
            const reasoning = escapeHtml(data.reasoning || '');
            const replyText = data.counter_reply ? (data.counter_reply.text || '') : '';
            const replyScript = data.counter_reply ? escapeHtml(data.counter_reply.script || '') : '';

            // Store the raw text (unescaped) for the clipboard copy, everything
            // rendered to the page goes through escapeHtml above.
            const replyForClipboard = replyText.replace(/'/g, "\\'").replace(/\n/g, '\\n');

            const htmlContent = `
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--line);">
                    <span style="font-size: 13px; color: var(--ink-soft);">
                        <b style="color: var(--ink);">Language:</b> ${language} ${data.is_code_mixed ? '(Code-mixed)' : ''}
                    </span>
                    <span class="result-badge" style="background: ${t.bg}; color: ${t.text}; border: 1px solid ${t.border};">
                        ${escapeHtml(t.rawLabel)} · ${confidencePercent}%
                    </span>
                </div>
                <div class="confidence-track" style="background: ${t.bg};">
                    <div class="confidence-fill" style="width: ${confidencePercent}%; background: ${t.text};"></div>
                </div>
                <div style="margin-top: 12px; font-size: 14px; line-height: 1.55; color: var(--ink);">
                    ${reasoning}
                </div>
                ${data.counter_reply ? `
                    <div class="reply-box">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <span style="font-size: 11px; color: var(--sage-700); font-weight: 600;">
                                Suggested reply${replyScript ? ' (' + replyScript + ')' : ''}
                            </span>
                            <button class="reply-copy-btn" onclick="copyReply(this, '${replyForClipboard}')">Copy</button>
                        </div>
                        <div style="font-size: 13px; font-style: italic; margin-top: 4px; color: var(--ink);">
                            "${escapeHtml(replyText)}"
                        </div>
                    </div>
                ` : ''}
            `;

            chatBox.innerHTML += `<div class="message bot">${htmlContent}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('prompt');
            const sendBtn = document.getElementById('send-btn');
            const chatBox = document.getElementById('chat-box');
            const prompt = input.value.trim();

            if (!prompt) return;

            appendUserMessage(prompt);
            input.value = '';
            sendBtn.disabled = true;

            const tempId = 'temp-' + Date.now();
            chatBox.innerHTML += `<div class="message bot pending" id="${tempId}">Analyzing claims &amp; language<span class="pulse-dots"><span></span><span></span><span></span></span></div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: prompt })
                });

                const data = await response.json();
                const tempElement = document.getElementById(tempId);
                if (tempElement) tempElement.remove();

                if (!response.ok || data.error) {
                    chatBox.innerHTML += `<div class="message bot error">Error: ${escapeHtml(data.error || 'Failed to analyze')}</div>`;
                } else {
                    renderBotResult(data);

                    const now = new Date();
                    const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    chatHistory.unshift({ prompt, result: data, time: timeString });
                    if (chatHistory.length > 15) chatHistory.pop();
                    renderHistory();
                }
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (error) {
                const tempElement = document.getElementById(tempId);
                if (tempElement) tempElement.remove();
                chatBox.innerHTML += `<div class="message bot error">Error: Could not connect to backend server.</div>`;
            } finally {
                sendBtn.disabled = false;
            }
        }

        document.getElementById('chat-box').innerHTML = renderEmptyState();
        renderHistory();
    </script>
</body>
</html>
